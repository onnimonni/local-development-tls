name: Local development certificate

on:
  workflow_call:
    inputs:
      domains:
        description: Comma-separated names to certify, e.g. "dev.example.com,*.dev.example.com"
        type: string
        required: true
      server:
        description: ACME server, a URL or a lego shortcode such as letsencrypt-staging
        type: string
        default: letsencrypt
      retention-days:
        description: How long the artifact is kept
        type: number
        default: 90
    secrets:
      cloudflare-token:
        description: Cloudflare API token with Zone:DNS:Edit and Zone:Zone:Read of the zone
        required: true

permissions: {}

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Renew certificate
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.cloudflare-token }}
          DOMAINS: ${{ inputs.domains }}
          LEGO_SERVER: ${{ inputs.server }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != true ]; then
            echo "::error::$GITHUB_REPOSITORY is not private"
            exit 1
          fi
          if [ -z "${DOMAINS//[ ,]/}" ]; then
            echo "::error::No domains"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_DNS_API_TOKEN" ]; then
            echo "::error::No cloudflare-token"
            exit 1
          fi
          mkdir -m 700 "$RUNNER_TEMP/lego"
          docker run --rm --user "$(id -u):$(id -g)" -e CLOUDFLARE_DNS_API_TOKEN -e LEGO_SERVER -v "$RUNNER_TEMP/lego:/data" \
            goacme/lego:v5.5.2@sha256:1944e8c36055beec47c7de6f15202b41128be75eea0ffa257f0c14d93c5155fd \
            run --accept-tos --dns cloudflare --key-type ec256 --path /data --pem \
            --cert.name local-development-tls --domains "${DOMAINS// /}"

      - name: Upload certificate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/lego/certificates/local-development-tls.pem
          archive: false
          retention-days: ${{ inputs.retention-days }}
