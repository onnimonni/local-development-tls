name: Trusted HTTPS certificate to artifacts
description: A publicly trusted Let's Encrypt certificate via Cloudflare DNS, kept as the private repository's https-certificate artifact
branding:
  icon: lock
  color: green

inputs:
  domains:
    description: Comma-separated names to certify, with {a,b} brace expansion, e.g. "{app,api}.example.com,*.example.com". One certificate per registered domain (and per 100 names), at most 20
    required: true
  cloudflare-token:
    description: Cloudflare API token with Zone:DNS:Edit and Zone:Zone:Read of the zone
    required: true
  server:
    description: ACME server, a URL or a lego shortcode such as letsencrypt-staging
    default: letsencrypt
  retention-days:
    description: How long the artifact is kept
    default: "90"

runs:
  using: composite
  steps:
    - name: Check repository
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CLOUDFLARE_DNS_API_TOKEN: ${{ inputs.cloudflare-token }}
      run: |
        if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != true ]; then
          echo "::error::$GITHUB_REPOSITORY is not private"
          exit 1
        fi
        if [ -z "$CLOUDFLARE_DNS_API_TOKEN" ]; then
          echo "::error::No cloudflare-token"
          exit 1
        fi

    - name: Plan certificates
      shell: ruby {0}
      env:
        DOMAINS: ${{ inputs.domains }}
        PLAN: ${{ runner.temp }}/https-certificate-plan
      run: |
        def expand(pattern)
          match = pattern.match(/\A(.*)\{([^{}]*)\}(.*)\z/)
          return [pattern] unless match
          match[2].split(",", -1).flat_map { |alt| expand("#{match[1]}#{alt}#{match[3]}") }
        end

        def braces(node)
          own = node[:name] ? [""] : []
          children = node.except(:name).map { |label, child| [label, braces(child)] }
          own + children.group_by(&:last).flat_map do |below, pairs|
            labels = pairs.map(&:first).sort
            label = labels.one? ? labels.first : "{#{labels.join(",")}}"
            below.map { |prefix| prefix.empty? ? label : "#{prefix}.#{label}" }
          end.sort
        end

        def compress(names)
          tree = {}
          names.each do |name|
            node = name.split(".").reverse.inject(tree) { |parent, label| parent[label] ||= {} }
            node[:name] = true
          end
          braces(tree)
        end

        def registered_domain(name)
          labels = name.split(".")
          second_level = labels.size > 2 && labels[-1].size == 2 && %w[ac co com edu gov net org].include?(labels[-2])
          labels.last(second_level ? 3 : 2).join(".")
        end

        names = expand("{#{ENV.fetch("DOMAINS").delete(" ")}}").reject(&:empty?).uniq.sort
        raise "No domains" if names.empty?

        certificates = names.group_by { |name| registered_domain(name) }.sort.flat_map do |domain, group|
          group.each_slice(100).with_index.map { |slice, i| [i.zero? ? domain : "#{domain}-#{i + 1}", slice] }
        end
        raise "#{certificates.size} certificates: at most 20" if certificates.size > 20

        File.write(ENV.fetch("PLAN"), certificates.map { |file, slice| "#{file}\t#{slice.join(",")}\n" }.join)
        File.write(ENV.fetch("GITHUB_STEP_SUMMARY"), <<~SUMMARY, mode: "a")
          | Certificate | Names |
          |---|---|
          #{certificates.map { |file, slice| "| `#{file}.pem` | `#{compress(slice).join(",")}` |" }.join("\n")}
        SUMMARY

    - name: Issue certificates
      shell: bash
      env:
        CLOUDFLARE_DNS_API_TOKEN: ${{ inputs.cloudflare-token }}
        LEGO_SERVER: ${{ inputs.server }}
        PLAN: ${{ runner.temp }}/https-certificate-plan
      run: |
        mkdir -m 700 "$RUNNER_TEMP/lego" "$RUNNER_TEMP/https-certificate"
        while IFS=$'\t' read -r cert names; do
          docker run --rm --user "$(id -u):$(id -g)" -e CLOUDFLARE_DNS_API_TOKEN -e LEGO_SERVER -v "$RUNNER_TEMP/lego:/data" \
            goacme/lego:v5.5.2@sha256:1944e8c36055beec47c7de6f15202b41128be75eea0ffa257f0c14d93c5155fd \
            run --accept-tos --dns cloudflare --key-type ec256 --path /data --pem \
            --cert.name "$cert" --domains "$names" < /dev/null
          cp "$RUNNER_TEMP/lego/certificates/$cert.pem" "$RUNNER_TEMP/https-certificate/"
        done < "$PLAN"

    - name: Upload certificates
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: https-certificate
        path: ${{ runner.temp }}/https-certificate/
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
