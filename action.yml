name: Trusted HTTPS certificate to artifacts
description: A publicly trusted Let's Encrypt certificate via Cloudflare DNS, kept as the private repository's https-certificate artifact
branding:
  icon: lock
  color: green

inputs:
  domains:
    description: Comma-separated names to certify, with {a,b} brace expansion, e.g. "{app,api}.example.com,*.example.com". One certificate per registered domain, split by subdomain past 100 names; at most 20
    required: true
  cloudflare-token:
    description: Cloudflare API token with Zone:DNS:Edit and Zone:Zone:Read of the zone
    required: true
  server:
    description: ACME server, a URL or a lego shortcode such as letsencrypt-staging
    default: letsencrypt
  retention-days:
    description: How long the artifact is kept
    default: "90"

runs:
  using: composite
  steps:
    - name: Check repository
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CLOUDFLARE_DNS_API_TOKEN: ${{ inputs.cloudflare-token }}
      run: |
        if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != true ]; then
          echo "::error::$GITHUB_REPOSITORY is not private"
          exit 1
        fi
        if [ -z "$CLOUDFLARE_DNS_API_TOKEN" ]; then
          echo "::error::No cloudflare-token"
          exit 1
        fi

    - name: Plan certificates
      shell: ruby {0}
      env:
        DOMAINS: ${{ inputs.domains }}
        PLAN: ${{ runner.temp }}/https-certificate-plan
      run: |
        def expand(pattern)
          match = pattern.match(/\A(.*)\{([^{}]*)\}(.*)\z/)
          return [pattern] unless match
          match[2].split(",", -1).flat_map { |alt| expand("#{match[1]}#{alt}#{match[3]}") }
        end

        def braces(node)
          own = node[:name] ? [""] : []
          children = node.except(:name).map { |label, child| [label, braces(child)] }
          own + children.group_by(&:last).flat_map do |below, pairs|
            labels = pairs.map(&:first).sort
            label = labels.one? ? labels.first : "{#{labels.join(",")}}"
            below.map { |prefix| prefix.empty? ? label : "#{prefix}.#{label}" }
          end.sort
        end

        def compress(names)
          tree = {}
          names.each do |name|
            node = name.split(".").reverse.inject(tree) { |parent, label| parent[label] ||= {} }
            node[:name] = true
          end
          braces(tree)
        end

        def registered_domain(name)
          labels = name.split(".")
          second_level = labels.size > 2 && labels[-1].size == 2 && %w[ac co com edu gov net org].include?(labels[-2])
          labels.last(second_level ? 3 : 2).join(".")
        end

        def below(name, suffix)
          name == suffix ? [] : name.delete_suffix(".#{suffix}").split(".")
        end

        # `_._.app.example.com` for names up to two labels below app.example.com (`_` for
        # any label, like lego names wildcard certificates: artifacts can't hold `*`).
        def file_name(names, labels, suffix)
          base = labels.empty? ? suffix : "#{labels.one? ? labels.first : "{#{labels.join(",")}}"}.#{suffix}"
          depth = names.map { |name| below(name, suffix).size }.max - (labels.empty? ? 0 : 1)
          (["_"] * depth + [base]).join(".").tr("*", "_")
        end

        # Up to 100 names under `suffix` share one certificate; more are split by the label
        # right below it, packing its groups in order, and a group over 100 one level deeper.
        def plan(names, suffix)
          return [[file_name(names, [], suffix), names]] if names.size <= 100
          split, packed = [], []
          names.group_by { |name| below(name, suffix).last }.sort_by { |label, _| label.to_s }.each do |label, group|
            if label && group.size > 100
              split.concat(plan(group, "#{label}.#{suffix}"))
            elsif packed.empty? || packed.last[1].size + group.size > 100
              packed << [[label].compact, group]
            else
              packed.last[0] << label if label
              packed.last[1].concat(group)
            end
          end
          packed.map { |labels, group| [file_name(group, labels, suffix), group] } + split
        end

        names = expand("{#{ENV.fetch("DOMAINS").delete(" ")}}").reject(&:empty?).uniq.sort
        raise "No domains" if names.empty?

        certificates = names.group_by { |name| registered_domain(name) }.sort.flat_map { |domain, group| plan(group, domain) }
        raise "#{certificates.size} certificates: at most 20" if certificates.size > 20

        File.write(ENV.fetch("PLAN"), certificates.map.with_index(1) { |(file, group), i| "cert-#{i}\t#{file}\t#{group.join(",")}\n" }.join)
        File.write(ENV.fetch("GITHUB_STEP_SUMMARY"), <<~SUMMARY, mode: "a")
          | Certificate | Names |
          |---|---|
          #{certificates.map { |file, group| "| `#{file}.pem` | `#{compress(group).join(",")}` |" }.join("\n")}
        SUMMARY

    - name: Issue certificates
      shell: bash
      env:
        CLOUDFLARE_DNS_API_TOKEN: ${{ inputs.cloudflare-token }}
        LEGO_SERVER: ${{ inputs.server }}
        PLAN: ${{ runner.temp }}/https-certificate-plan
      run: |
        mkdir -m 700 "$RUNNER_TEMP/lego" "$RUNNER_TEMP/https-certificate"
        while IFS=$'\t' read -r cert file names; do
          docker run --rm --user "$(id -u):$(id -g)" -e CLOUDFLARE_DNS_API_TOKEN -e LEGO_SERVER -v "$RUNNER_TEMP/lego:/data" \
            goacme/lego:v5.5.2@sha256:1944e8c36055beec47c7de6f15202b41128be75eea0ffa257f0c14d93c5155fd \
            run --accept-tos --dns cloudflare --key-type ec256 --path /data --pem \
            --cert.name "$cert" --domains "$names" < /dev/null
          cp "$RUNNER_TEMP/lego/certificates/$cert.pem" "$RUNNER_TEMP/https-certificate/$file.pem"
        done < "$PLAN"

    - name: Upload certificates
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: https-certificate
        path: ${{ runner.temp }}/https-certificate/
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
