name: Trusted HTTPS certificate to artifacts
description: A publicly trusted Let's Encrypt certificate via Cloudflare DNS, kept as the private repository's https-certificate.pem artifact
branding:
  icon: lock
  color: green

inputs:
  domains:
    description: Comma-separated names to certify, with {a,b} brace expansion, e.g. "{app,api}.example.com,*.example.com"
    required: true
  cloudflare-token:
    description: Cloudflare API token with Zone:DNS:Edit and Zone:Zone:Read of the zone
    required: true
  server:
    description: ACME server, a URL or a lego shortcode such as letsencrypt-staging
    default: letsencrypt
  retention-days:
    description: How long the artifact is kept
    default: "90"

runs:
  using: composite
  steps:
    - name: Renew certificate
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CLOUDFLARE_DNS_API_TOKEN: ${{ inputs.cloudflare-token }}
        DOMAINS: ${{ inputs.domains }}
        LEGO_SERVER: ${{ inputs.server }}
      run: |
        if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != true ]; then
          echo "::error::$GITHUB_REPOSITORY is not private"
          exit 1
        fi
        expand() {
          if [[ $1 =~ ^(.*)\{([^{}]*)\}(.*)$ ]]; then
            local pre=${BASH_REMATCH[1]} post=${BASH_REMATCH[3]} alt alts
            IFS=, read -ra alts <<< "${BASH_REMATCH[2]}"
            for alt in "${alts[@]}"; do expand "$pre$alt$post"; done
          else
            echo "$1"
          fi
        }
        names=$(expand "{${DOMAINS// /}}" | grep . | sort -u | paste -sd, -)
        if [ -z "$names" ]; then
          echo "::error::No domains"
          exit 1
        fi
        count=$(tr , '\n' <<< "$names" | grep -c .)
        if [ "$count" -gt 100 ]; then
          echo "::error::$count names: a certificate can have at most 100"
          exit 1
        fi
        if [ -z "$CLOUDFLARE_DNS_API_TOKEN" ]; then
          echo "::error::No cloudflare-token"
          exit 1
        fi
        mkdir -m 700 "$RUNNER_TEMP/lego"
        docker run --rm --user "$(id -u):$(id -g)" -e CLOUDFLARE_DNS_API_TOKEN -e LEGO_SERVER -v "$RUNNER_TEMP/lego:/data" \
          goacme/lego:v5.5.2@sha256:1944e8c36055beec47c7de6f15202b41128be75eea0ffa257f0c14d93c5155fd \
          run --accept-tos --dns cloudflare --key-type ec256 --path /data --pem \
          --cert.name https-certificate --domains "$names"

    - name: Upload certificate
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ${{ runner.temp }}/lego/certificates/https-certificate.pem
        archive: false
        retention-days: ${{ inputs.retention-days }}
